name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve current stable tooling
        shell: bash
        run: |
          for p in uno.sdk uno.templates skiasharp skiasharp.views.uno.winui; do
            echo "$p=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/$p/index.json | jq -r '[.versions[] | select(contains("-") | not)] | last')"
          done
          dotnet new install Uno.Templates
          dotnet new unoapp -h
          dotnet new unoapp -preset blank -platforms browser -o /tmp/UnoProbe --no-restore
          find /tmp/UnoProbe -name '*.csproj' -o -name 'global.json' -o -name '*Program.cs' | xargs -r -n 1 sh -c 'echo FILE: "$0"; cat "$0"'
