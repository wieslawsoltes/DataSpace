name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify core
        run: dotnet build src/DataSpace.Core/DataSpace.Core.csproj -c Release
      - name: Verify Uno project conventions
        run: |
          dotnet new install Uno.Templates@6.7.30
          dotnet new unoapp -preset blank -platforms wasm desktop -o /tmp/UnoProbe --skip-restore
          dotnet new unolib -o /tmp/UnoLibrary --skip-restore
          find /tmp/UnoProbe /tmp/UnoLibrary -name '*.csproj' -o -name 'global.json' -o -name '*Program.cs' -o -name 'App.xaml' | xargs -r -n 1 sh -c 'echo FILE: "$0"; cat "$0"'
