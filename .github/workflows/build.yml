name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test database and query engine
        run: dotnet test tests/DataSpace.Tests/DataSpace.Tests.csproj -c Release --logger 'trx;LogFileName=tests.trx'
      - name: Verify Uno project conventions
        if: always()
        run: |
          dotnet new install Uno.Templates@6.7.30
          dotnet new unoapp -preset blank -platforms wasm desktop -o /tmp/UnoProbe --skip-restore
          find /tmp/UnoProbe -name '*.csproj' -o -name 'global.json' -o -name '*Program.cs' -o -name 'App.xaml' | xargs -r -n 1 sh -c 'echo FILE: "$0"; cat "$0"'
          dotnet new unolib -o /tmp/UnoLibrary || true
          find /tmp/UnoLibrary -name '*.csproj' -o -name 'global.json' | xargs -r -n 1 sh -c 'echo FILE: "$0"; cat "$0"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
