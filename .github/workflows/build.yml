name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test database, SQL and storage
        run: dotnet test tests/DataSpace.Tests/DataSpace.Tests.csproj -c Release --logger 'trx;LogFileName=tests.trx'
      - name: Compile reusable renderers
        run: dotnet build src/DataSpace.Rendering/DataSpace.Rendering.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Compile reusable Uno controls
        run: dotnet build src/DataSpace.Controls/DataSpace.Controls.csproj -c Release -f net10.0-desktop
