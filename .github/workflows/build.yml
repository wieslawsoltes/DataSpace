name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test database, query and storage libraries
        run: dotnet test tests/DataSpace.Tests/DataSpace.Tests.csproj -c Release --logger 'trx;LogFileName=tests.trx'
      - name: Compile reusable renderers
        run: dotnet build src/DataSpace.Rendering/DataSpace.Rendering.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Compile desktop application
        run: dotnet build src/DataSpace.App/DataSpace.App.csproj -c Release -f net10.0-desktop
      - name: Publish browser application
        run: dotnet publish src/DataSpace.App/DataSpace.App.csproj -c Release -f net10.0-browserwasm -o artifacts/publish -p:WasmShellWebAppBasePath=./
      - name: Stage static site
        run: python3 scripts/stage-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        working-directory: scripts
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test browser persistence and launch the real Uno app
        env:
          DATASPACE_SCREENSHOTS: ${{ github.workspace }}/artifacts/qa
        run: |
          mkdir -p artifacts/server/DataSpace
          cp -a artifacts/site/. artifacts/server/DataSpace/
          printf '<!doctype html><title>DataSpace storage test</title>' > artifacts/server/DataSpace/storage-test.html
          python3 -m http.server 4173 --bind 127.0.0.1 --directory artifacts/server > artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for retry in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/DataSpace/storage-test.html > /dev/null && break || sleep 1; done
          node scripts/browser-smoke.mjs
          mkdir -p artifacts/site/qa
          cp artifacts/qa/workspace.png artifacts/site/qa/workspace.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: |
            artifacts/qa
            artifacts/server.log
      - name: Verify all reusable libraries can be packaged
        run: |
          set -euo pipefail
          for project in Core Query Storage Rendering Controls; do
            dotnet pack "src/DataSpace.$project/DataSpace.$project.csproj" -c Release -o artifacts/packages
          done
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: reusable-libraries
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: browser-app
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [engine, application]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          path: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy browser application
        id: deployment
        uses: actions/deploy-pages@v4
